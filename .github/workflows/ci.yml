name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ '11', '17', '21' ]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build and test
        run: mvn -B verify

      - name: Smoke test every engine
        run: |
          java -jar target/inference-engine.jar --example classic --goal H --mode compare --strategy specific
          java -jar target/inference-engine.jar --example animals --goal cheetah --mode backward --quiet
          java -jar target/inference-engine.jar --example incident-triage --goal rollback_release --mode hybrid --quiet

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t symbolic-ai-inference-engine .

      - name: Run default demo
        run: docker run --rm symbolic-ai-inference-engine
